<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #07070c;
        }

        .bg {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background: #07070c;
        }

        /* Базовый слой — плавный радиальный градиент */
        .base {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse 120% 100% at 50% 120%, #14101f 0%, transparent 60%),
                radial-gradient(ellipse 100% 80% at 0% 0%, #0f1420 0%, transparent 50%),
                radial-gradient(ellipse 100% 80% at 100% 100%, #1a1220 0%, transparent 50%),
                #07070c;
        }

        /* Тёплое пятно */
        .warm {
            position: absolute;
            width: 80vmax;
            height: 80vmax;
            top: 20%;
            left: 10%;
            background: radial-gradient(
                circle at center,
                rgba(160, 120, 70, 0.12) 0%,
                rgba(120, 90, 50, 0.06) 30%,
                transparent 60%
            );
            filter: blur(60px);
            animation: warmMove 20s ease-in-out infinite alternate;
            mix-blend-mode: screen;
        }

        /* Холодное пятно */
        .cool {
            position: absolute;
            width: 90vmax;
            height: 90vmax;
            bottom: 10%;
            right: 5%;
            background: radial-gradient(
                circle at center,
                rgba(70, 90, 140, 0.15) 0%,
                rgba(50, 70, 120, 0.07) 30%,
                transparent 60%
            );
            filter: blur(70px);
            animation: coolMove 25s ease-in-out infinite alternate;
            mix-blend-mode: screen;
        }

        /* Центральное сияние */
        .center-glow {
            position: absolute;
            width: 70vmax;
            height: 70vmax;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(
                circle at center,
                rgba(140, 110, 80, 0.08) 0%,
                rgba(100, 80, 120, 0.05) 40%,
                transparent 70%
            );
            filter: blur(50px);
            animation: centerPulse 18s ease-in-out infinite alternate;
            mix-blend-mode: screen;
        }

        /* Dithering — микроскопический шум, разбивает полосы */
        .dither {
            position: absolute;
            inset: -100%;
            width: 300%;
            height: 300%;
            opacity: 0.025;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 256px 256px;
            animation: ditherShift 3s steps(8) infinite;
        }

        /* Виньетка */
        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(
                ellipse at center,
                transparent 40%,
                rgba(5, 5, 10, 0.5) 100%
            );
            pointer-events: none;
        }

        @keyframes warmMove {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(10%, 5%) scale(1.1); }
        }

        @keyframes coolMove {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-8%, -6%) scale(1.15); }
        }

        @keyframes centerPulse {
            0%   { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        @keyframes ditherShift {
            0%   { transform: translate(0, 0); }
            12%  { transform: translate(-5%, -10%); }
            25%  { transform: translate(-15%, 5%); }
            37%  { transform: translate(7%, -25%); }
            50%  { transform: translate(-5%, 25%); }
            62%  { transform: translate(-15%, 10%); }
            75%  { transform: translate(15%, 0%); }
            87%  { transform: translate(0%, 15%); }
            100% { transform: translate(0, 0); }
        }

        /* 4K */
        @media (min-width: 2560px) {
            .warm, .cool, .center-glow { filter: blur(80px); }
            .dither { background-size: 512px 512px; }
        }
        @media (min-width: 3840px) {
            .warm, .cool, .center-glow { filter: blur(100px); }
            .dither { background-size: 768px 768px; }
        }
    </style>
</head>
<body>
    <div class="bg">
        <div class="base"></div>
        <div class="warm"></div>
        <div class="cool"></div>
        <div class="center-glow"></div>
        <div class="dither"></div>
        <div class="vignette"></div>
    </div>
</body>
</html>
