<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050508;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Сильное размытие убирает ЛЮБЫЕ артефакты */
            filter: blur(80px) saturate(1.2);
            transform: scale(1.15);
        }

        /* Виньетка поверх */
        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(
                ellipse at center,
                transparent 30%,
                rgba(3, 3, 6, 0.7) 100%
            );
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>
    <canvas id="bg"></canvas>
    <div class="vignette"></div>

    <script>
        const canvas = document.getElementById('bg');
        const ctx = canvas.getContext('2d');

        let width, height;
        let time = 0;

        // Цветовые пятна
        const blobs = [
            { x: 0.3, y: 0.4, r: 0.5, color: [40, 25, 70], speed: 0.15 },
            { x: 0.7, y: 0.6, r: 0.45, color: [70, 35, 50], speed: 0.12 },
            { x: 0.5, y: 0.5, r: 0.4, color: [30, 45, 80], speed: 0.18 },
            { x: 0.2, y: 0.7, r: 0.35, color: [90, 70, 40], speed: 0.10 },
            { x: 0.8, y: 0.3, r: 0.38, color: [50, 30, 60], speed: 0.14 },
        ];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        function draw() {
            time += 0.005;

            // Базовый цвет
            ctx.fillStyle = '#050508';
            ctx.fillRect(0, 0, width, height);

            // Рисуем пятна
            blobs.forEach((blob, i) => {
                const x = (blob.x + Math.sin(time * blob.speed + i) * 0.1) * width;
                const y = (blob.y + Math.cos(time * blob.speed * 0.8 + i) * 0.1) * height;
                const r = blob.r * Math.max(width, height) * 0.8;

                const gradient = ctx.createRadialGradient(x, y, 0, x, y, r);
                const [r1, g1, b1] = blob.color;
                gradient.addColorStop(0, `rgba(${r1}, ${g1}, ${b1}, 0.6)`);
                gradient.addColorStop(0.4, `rgba(${r1}, ${g1}, ${b1}, 0.3)`);
                gradient.addColorStop(1, `rgba(${r1}, ${g1}, ${b1}, 0)`);

                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, width, height);
            });

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
