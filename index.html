<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #07070c;
        }

        .bg {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background: #07070c;
        }

        /* Базовый вращающийся conic-градиент */
        .bg::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200vmax;
            height: 200vmax;
            transform: translate(-50%, -50%);
            background: conic-gradient(
                from 0deg at 50% 50%,
                #0a0a14 0deg,
                #1a1028 60deg,
                #0f1a2e 120deg,
                #1a1520 180deg,
                #0a1a20 240deg,
                #15102a 300deg,
                #0a0a14 360deg
            );
            animation: rotate 60s linear infinite;
            filter: blur(80px);
            opacity: 0.7;
        }

        /* Тёплое золотое сияние */
        .warm {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150vmax;
            height: 150vmax;
            transform: translate(-50%, -50%);
            background: radial-gradient(
                ellipse at 30% 40%,
                rgba(180, 140, 80, 0.15) 0%,
                transparent 50%
            ),
            radial-gradient(
                ellipse at 70% 60%,
                rgba(140, 100, 60, 0.1) 0%,
                transparent 50%
            );
            animation: drift1 25s ease-in-out infinite alternate;
            mix-blend-mode: screen;
        }

        /* Холодное синее сияние */
        .cool {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150vmax;
            height: 150vmax;
            transform: translate(-50%, -50%);
            background: radial-gradient(
                ellipse at 60% 30%,
                rgba(80, 100, 160, 0.2) 0%,
                transparent 50%
            ),
            radial-gradient(
                ellipse at 40% 70%,
                rgba(60, 80, 140, 0.15) 0%,
                transparent 50%
            );
            animation: drift2 30s ease-in-out infinite alternate-reverse;
            mix-blend-mode: screen;
        }

        /* Тонкая световая полоса по центру */
        .beam {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120vmax;
            height: 120vmax;
            transform: translate(-50%, -50%) rotate(-15deg);
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(200, 180, 140, 0.04) 45%,
                rgba(220, 200, 160, 0.08) 50%,
                rgba(200, 180, 140, 0.04) 55%,
                transparent 100%
            );
            animation: beamMove 15s ease-in-out infinite alternate;
            mix-blend-mode: screen;
        }

        /* Виньетка */
        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(
                ellipse at center,
                transparent 0%,
                transparent 50%,
                rgba(5, 5, 10, 0.7) 100%
            );
            pointer-events: none;
        }

        @keyframes rotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes drift1 {
            0%   { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-45%, -55%) scale(1.1); }
        }

        @keyframes drift2 {
            0%   { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-55%, -45%) scale(1.15); }
        }

        @keyframes beamMove {
            0%   { transform: translate(-50%, -50%) rotate(-15deg) scaleX(1); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) rotate(-10deg) scaleX(1.2); opacity: 1; }
        }

        /* 4K */
        @media (min-width: 2560px) {
            .bg::before { filter: blur(120px); }
        }
        @media (min-width: 3840px) {
            .bg::before { filter: blur(160px); }
        }
    </style>
</head>
<body>
    <div class="bg">
        <div class="warm"></div>
        <div class="cool"></div>
        <div class="beam"></div>
        <div class="vignette"></div>
    </div>
</body>
</html>
