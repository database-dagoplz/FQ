<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050508;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            filter: blur(80px) saturate(1.2);
            transform: scale(1.15);
        }

        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(3, 3, 6, 0.7) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* ===== СТЕКЛЯННОЕ ОКНО ===== */
        .glass-window {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: min(85vw, 1200px);
            height: min(80vh, 800px);
            z-index: 2;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(40px) saturate(1.4);
            -webkit-backdrop-filter: blur(40px) saturate(1.4);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow:
                inset 0 1px 0 0 rgba(255, 255, 255, 0.06),
                inset 0 -1px 0 0 rgba(0, 0, 0, 0.2),
                0 30px 60px -20px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ===== ВЕРХНЯЯ ПОЛОСКА ===== */
        .header {
            height: 64px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.04);
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Заглушки для будущего функционала */
        .header-placeholder {
            width: 80px;
            height: 28px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .header-placeholder.small {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }

        /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
        .content {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        /* Блик и градиент окна */
        .glass-window::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.12) 50%, transparent 100%);
            z-index: 10;
        }

        .glass-window::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.015) 0%, transparent 50%, rgba(0, 0, 0, 0.04) 100%);
            pointer-events: none;
            border-radius: 24px;
            z-index: 10;
        }

        /* 4K */
        @media (min-width: 2560px) {
            .glass-window { width: min(75vw, 1600px); height: min(75vh, 1000px); border-radius: 32px; }
            .header { height: 72px; padding: 0 36px; }
            .glass-window::after { border-radius: 32px; }
        }

        @media (min-width: 3840px) {
            .glass-window { width: min(70vw, 2000px); height: min(75vh, 1200px); border-radius: 40px; }
            .header { height: 80px; padding: 0 44px; }
            .glass-window::after { border-radius: 40px; }
        }

        @media (max-width: 768px) {
            .glass-window { width: 92vw; height: 85vh; border-radius: 20px; }
            .header { height: 56px; padding: 0 20px; }
            .glass-window::after { border-radius: 20px; }
        }
    </style>
</head>
<body>
    <canvas id="bg"></canvas>
    <div class="vignette"></div>

    <div class="glass-window">
        <!-- Верхняя полоска -->
        <div class="header">
            <div class="header-left">
                <div class="header-placeholder small"></div>
                <div class="header-placeholder"></div>
            </div>
            <div class="header-right">
                <div class="header-placeholder small"></div>
                <div class="header-placeholder small"></div>
            </div>
        </div>

        <!-- Основной контент (пока пустой) -->
        <div class="content"></div>
    </div>

    <script>
        // ===== CANVAS ФОН =====
        const canvas = document.getElementById('bg');
        const ctx = canvas.getContext('2d');
        let width, height, time = 0;

        const blobs = [
            { x: 0.3, y: 0.4, r: 0.5, color: [40, 25, 70], speed: 0.15 },
            { x: 0.7, y: 0.6, r: 0.45, color: [70, 35, 50], speed: 0.12 },
            { x: 0.5, y: 0.5, r: 0.4, color: [30, 45, 80], speed: 0.18 },
            { x: 0.2, y: 0.7, r: 0.35, color: [90, 70, 40], speed: 0.10 },
            { x: 0.8, y: 0.3, r: 0.38, color: [50, 30, 60], speed: 0.14 },
        ];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function draw() {
            time += 0.005;
            ctx.fillStyle = '#050508';
            ctx.fillRect(0, 0, width, height);

            blobs.forEach((blob, i) => {
                const x = (blob.x + Math.sin(time * blob.speed + i) * 0.1) * width;
                const y = (blob.y + Math.cos(time * blob.speed * 0.8 + i) * 0.1) * height;
                const r = blob.r * Math.max(width, height) * 0.8;

                const gradient = ctx.createRadialGradient(x, y, 0, x, y, r);
                const [r1, g1, b1] = blob.color;
                gradient.addColorStop(0, `rgba(${r1}, ${g1}, ${b1}, 0.6)`);
                gradient.addColorStop(0.4, `rgba(${r1}, ${g1}, ${b1}, 0.3)`);
                gradient.addColorStop(1, `rgba(${r1}, ${g1}, ${b1}, 0)`);

                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, width, height);
            });

            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
