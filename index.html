<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0a0f;
            overflow: hidden;
            position: relative;
        }

        /* Анимированные градиентные пятна */
        .gradient-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            animation: float 20s ease-in-out infinite;
        }

        .blob-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(100, 100, 150, 0.6) 0%, transparent 70%);
            top: -200px;
            left: -200px;
            animation-delay: 0s;
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(80, 80, 120, 0.5) 0%, transparent 70%);
            bottom: -150px;
            right: -150px;
            animation-delay: -7s;
        }

        .blob-3 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(120, 110, 100, 0.3) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -14s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(100px, -50px) scale(1.1);
            }
            66% {
                transform: translate(-50px, 100px) scale(0.9);
            }
        }

        /* Мягкий оверлей для глубины */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at center, transparent 0%, rgba(10, 10, 15, 0.3) 100%);
            pointer-events: none;
        }

        /* 4K оптимизация */
        @media (min-width: 2560px) {
            .gradient-blob {
                filter: blur(180px);
            }
            .blob-1 { width: 800px; height: 800px; }
            .blob-2 { width: 700px; height: 700px; }
            .blob-3 { width: 600px; height: 600px; }
        }

        @media (min-width: 3840px) {
            .gradient-blob {
                filter: blur(240px);
            }
            .blob-1 { width: 1000px; height: 1000px; }
            .blob-2 { width: 900px; height: 900px; }
            .blob-3 { width: 800px; height: 800px; }
        }
    </style>
</head>
<body>
    <div class="gradient-blob blob-1"></div>
    <div class="gradient-blob blob-2"></div>
    <div class="gradient-blob blob-3"></div>
    <div class="overlay"></div>
</body>
</html>
