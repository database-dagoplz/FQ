<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050508;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            filter: blur(80px) saturate(1.2);
            transform: scale(1.15);
        }

        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(3, 3, 6, 0.7) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* ===== СТЕКЛЯННОЕ ОКНО ===== */
        .glass-window {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: min(85vw, 1200px);
            height: min(80vh, 800px);
            z-index: 2;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(40px) saturate(1.4);
            -webkit-backdrop-filter: blur(40px) saturate(1.4);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow:
                inset 0 1px 0 0 rgba(255, 255, 255, 0.06),
                inset 0 -1px 0 0 rgba(0, 0, 0, 0.2),
                0 30px 60px -20px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ===== ВЕРХНЯЯ ПОЛОСКА ===== */
        .header {
            height: 64px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.04);
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-placeholder {
            width: 80px;
            height: 28px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .header-placeholder.small {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }

        /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
        .content {
            flex: 1;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 40px 48px;
        }

        .content::-webkit-scrollbar { width: 6px; }
        .content::-webkit-scrollbar-track { background: transparent; }
        .content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        .content::-webkit-scrollbar-thumb:hover { background: rgba(212, 175, 55, 0.3); }

        /* ===== ЗАГОЛОВОК ГЛАВЫ ===== */
        .chapter-header {
            margin-bottom: 36px;
            display: flex;
            align-items: flex-end;
            gap: 20px;
            flex-wrap: wrap;
        }

        .chapter-number {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 72px;
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.9) 0%, rgba(212, 175, 55, 0.3) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -2px;
        }

        .chapter-title-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-bottom: 8px;
        }

        .chapter-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(212, 175, 55, 0.8);
        }

        .chapter-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 36px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.95);
            letter-spacing: -0.5px;
            line-height: 1.1;
        }

        .chapter-divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, rgba(212, 175, 55, 0.4) 0%, rgba(255, 255, 255, 0.08) 50%, transparent 100%);
            margin-bottom: 36px;
        }

        /* ===== СЕТКА ССЫЛОК ===== */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .link-card {
            position: relative;
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 24px 28px;
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            text-decoration: none;
            color: inherit;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            opacity: 0.6;
        }

        .link-card:hover {
            background: rgba(212, 175, 55, 0.05);
            border-color: rgba(212, 175, 55, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -15px rgba(212, 175, 55, 0.2);
        }

        .link-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            flex-shrink: 0;
            transition: all 0.4s;
        }

        .link-card:hover .link-icon {
            background: rgba(212, 175, 55, 0.15);
            transform: scale(1.05);
        }

        .link-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .link-name {
            font-size: 18px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.95);
        }

        .link-desc {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
        }

        .link-arrow {
            margin-left: auto;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }

        .link-card:hover .link-arrow {
            color: rgba(212, 175, 55, 0.9);
            transform: translateX(4px);
        }

        /* Особая карточка DONAT */
        .link-card.donate-card {
            grid-column: span 2;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.08) 0%, rgba(212, 175, 55, 0.02) 100%);
            border-color: rgba(212, 175, 55, 0.2);
            justify-content: center;
            text-align: center;
            flex-direction: column;
            gap: 12px;
            padding: 32px;
        }

        .link-card.donate-card .link-icon {
            width: 64px;
            height: 64px;
            font-size: 32px;
            background: rgba(212, 175, 55, 0.1);
            border-color: rgba(212, 175, 55, 0.3);
        }

        .link-card.donate-card .link-name {
            font-size: 22px;
            color: rgba(212, 175, 55, 0.95);
        }

        .link-card.donate-card .link-desc {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
        }

        .link-card.donate-card .link-arrow {
            display: none;
        }

        .link-card.donate-card:hover {
            border-color: rgba(212, 175, 55, 0.6);
            box-shadow: 0 20px 50px -15px rgba(212, 175, 55, 0.3);
        }

        /* ===== МОДАЛЬНОЕ ОКНО ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            width: min(90vw, 480px);
            background: rgba(20, 20, 28, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 36px;
            position: relative;
            transform: scale(0.95) translateY(20px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.8);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .modal-close:hover {
            background: rgba(240, 140, 140, 0.2);
            border-color: rgba(240, 140, 140, 0.4);
            color: rgba(240, 140, 140, 0.9);
        }

        .modal-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 24px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.95);
            text-align: center;
            margin-bottom: 28px;
        }

        .donate-options {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .donate-btn {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px 24px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            border: 1px solid transparent;
        }

        .donate-btn.steam {
            background: rgba(27, 40, 56, 0.6);
            color: #ffffff;
            border-color: rgba(102, 192, 244, 0.2);
        }

        .donate-btn.steam:hover {
            background: rgba(27, 40, 56, 0.9);
            border-color: rgba(102, 192, 244, 0.6);
            transform: translateX(4px);
            box-shadow: 0 10px 30px -10px rgba(102, 192, 244, 0.3);
        }

        .donate-btn.money {
            background: rgba(212, 175, 55, 0.1);
            color: rgba(212, 175, 55, 0.95);
            border-color: rgba(212, 175, 55, 0.3);
        }

        .donate-btn.money:hover {
            background: rgba(212, 175, 55, 0.2);
            border-color: rgba(212, 175, 55, 0.6);
            transform: translateX(4px);
            box-shadow: 0 10px 30px -10px rgba(212, 175, 55, 0.3);
        }

        .donate-btn-icon {
            font-size: 24px;
        }

        /* ===== БЛИК И ГРАДИЕНТ ОКНА ===== */
        .glass-window::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.12) 50%, transparent 100%);
            z-index: 10;
        }

        .glass-window::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.015) 0%, transparent 50%, rgba(0, 0, 0, 0.04) 100%);
            pointer-events: none;
            border-radius: 24px;
            z-index: 10;
        }

        /* Адаптивность */
        @media (min-width: 2560px) {
            .glass-window { width: min(75vw, 1600px); height: min(75vh, 1000px); border-radius: 32px; }
            .header { height: 72px; padding: 0 36px; }
            .glass-window::after { border-radius: 32px; }
            .content { padding: 56px 64px; }
            .chapter-number { font-size: 96px; }
            .chapter-title { font-size: 44px; }
        }

        @media (max-width: 768px) {
            .glass-window { width: 92vw; height: 85vh; border-radius: 20px; }
            .header { height: 56px; padding: 0 20px; }
            .glass-window::after { border-radius: 20px; }
            .content { padding: 28px 24px; }
            .links-grid { grid-template-columns: 1fr; }
            .link-card.donate-card { grid-column: span 1; }
            .chapter-number { font-size: 56px; }
            .chapter-title { font-size: 28px; }
        }
    </style>
</head>
<body>
    <canvas id="bg"></canvas>
    <div class="vignette"></div>

    <div class="glass-window">
        <!-- Верхняя полоска -->
        <div class="header">
            <div class="header-left">
                <div class="header-placeholder small"></div>
                <div class="header-placeholder"></div>
            </div>
            <div class="header-right">
                <div class="header-placeholder small"></div>
                <div class="header-placeholder small"></div>
            </div>
        </div>

        <!-- Основной контент -->
        <div class="content">
            <div class="chapter-header">
                <div class="chapter-number">02</div>
                <div class="chapter-title-group">
                    <div class="chapter-label">Глава</div>
                    <div class="chapter-title">ССЫЛКИ</div>
                </div>
            </div>

            <div class="chapter-divider"></div>

            <div class="links-grid">
                <!-- STEAM -->
                <a href="https://steamcommunity.com/profiles/76561199790602722/" target="_blank" class="link-card">
                    <div class="link-icon">🎮</div>
                    <div class="link-info">
                        <div class="link-name">Steam</div>
                        <div class="link-desc">Мой профиль в Steam</div>
                    </div>
                    <div class="link-arrow">→</div>
                </a>

                <!-- FACEIT -->
                <a href="https://www.faceit.com/ru/players/mainnotfake" target="_blank" class="link-card">
                    <div class="link-icon">🏆</div>
                    <div class="link-info">
                        <div class="link-name">FACEIT</div>
                        <div class="link-desc">mainnotfake</div>
                    </div>
                    <div class="link-arrow">→</div>
                </a>

                <!-- YOUTUBE -->
                <a href="https://www.youtube.com/@dagoplz" target="_blank" class="link-card">
                    <div class="link-icon">📺</div>
                    <div class="link-info">
                        <div class="link-name">YouTube</div>
                        <div class="link-desc">@dagoplz</div>
                    </div>
                    <div class="link-arrow">→</div>
                </a>

                <!-- TIKTOK -->
                <a href="https://www.tiktok.com/@wb.pc?_r=1" target="_blank" class="link-card">
                    <div class="link-icon">🎵</div>
                    <div class="link-info">
                        <div class="link-name">TikTok</div>
                        <div class="link-desc">@wb.pc</div>
                    </div>
                    <div class="link-arrow">→</div>
                </a>

                <!-- DONAT (Открывает модалку) -->
                <div class="link-card donate-card" id="openDonateModal">
                    <div class="link-icon">💎</div>
                    <div class="link-info">
                        <div class="link-name">Поддержать (DONAT)</div>
                        <div class="link-desc">Нажми, чтобы выбрать способ</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ДОНАТА -->
    <div class="modal-overlay" id="donateModal">
        <div class="modal-content">
            <button class="modal-close" id="closeDonateModal">&times;</button>
            <div class="modal-title">Выберите способ поддержки</div>
            
            <div class="donate-options">
                <a href="https://steamcommunity.com/tradeoffer/new/?partner=1830336994&token=SIiksOet" target="_blank" class="donate-btn steam">
                    <span class="donate-btn-icon">🔄</span>
                    <span>Донат трейдом Steam</span>
                </a>
                
                <a href="https://www.donationalerts.com/r/dagoplz1337" target="_blank" class="donate-btn money">
                    <span class="donate-btn-icon">💳</span>
                    <span>Денежный донат</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        // ===== ЛОГИКА МОДАЛЬНОГО ОКНА =====
        const openBtn = document.getElementById('openDonateModal');
        const modal = document.getElementById('donateModal');
        const closeBtn = document.getElementById('closeDonateModal');

        // Открыть модалку
        openBtn.addEventListener('click', () => {
            modal.classList.add('active');
        });

        // Закрыть модалку по крестику
        closeBtn.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        // Закрыть модалку при клике вне окна
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('active');
            }
        });

        // Закрыть по клавише Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                modal.classList.remove('active');
            }
        });

        // ===== CANVAS ФОН =====
        const canvas = document.getElementById('bg');
        const ctx = canvas.getContext('2d');
        let width, height, time = 0;

        const blobs = [
            { x: 0.3, y: 0.4, r: 0.5, color: [40, 25, 70], speed: 0.15 },
            { x: 0.7, y: 0.6, r: 0.45, color: [70, 35, 50], speed: 0.12 },
            { x: 0.5, y: 0.5, r: 0.4, color: [30, 45, 80], speed: 0.18 },
            { x: 0.2, y: 0.7, r: 0.35, color: [90, 70, 40], speed: 0.10 },
            { x: 0.8, y: 0.3, r: 0.38, color: [50, 30, 60], speed: 0.14 },
        ];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function draw() {
            time += 0.005;
            ctx.fillStyle = '#050508';
            ctx.fillRect(0, 0, width, height);

            blobs.forEach((blob, i) => {
                const x = (blob.x + Math.sin(time * blob.speed + i) * 0.1) * width;
                const y = (blob.y + Math.cos(time * blob.speed * 0.8 + i) * 0.1) * height;
                const r = blob.r * Math.max(width, height) * 0.8;

                const gradient = ctx.createRadialGradient(x, y, 0, x, y, r);
                const [r1, g1, b1] = blob.color;
                gradient.addColorStop(0, `rgba(${r1}, ${g1}, ${b1}, 0.6)`);
                gradient.addColorStop(0.4, `rgba(${r1}, ${g1}, ${b1}, 0.3)`);
                gradient.addColorStop(1, `rgba(${r1}, ${g1}, ${b1}, 0)`);

                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, width, height);
            });

            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
