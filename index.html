
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            min-height: 100vh;
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(30, 30, 40, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(20, 20, 30, 0.3) 0%, transparent 50%),
                linear-gradient(135deg, #0a0a0c 0%, #0f0f14 50%, #0a0a0c 100%);
            background-attachment: fixed;
            color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }

        /* Тонкая текстура шума для премиального ощущения */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0.025;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            z-index: 1;
        }

        /* Центральная точка — единственная деталь */
        .center-dot {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background: rgba(212, 175, 55, 0.6);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.5); }
        }

        /* ===== 4K OPTIMIZATION ===== */
        @media (min-width: 2560px) {
            html { font-size: 18px; }
        }

        @media (min-width: 3840px) {
            html { font-size: 22px; }
        }

        @media (min-resolution: 2dppx) {
            body { -webkit-font-smoothing: subpixel-antialiased; }
        }
    </style>
</head>
<body>
    <div class="center-dot"></div>
</body>
</html>
