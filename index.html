<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #05050a;
            -webkit-font-smoothing: antialiased;
        }

        .aurora {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background: #05050a;
        }

        /* Базовый глубокий градиент */
        .aurora::before {
            content: '';
            position: absolute;
            inset: -50%;
            background: 
                radial-gradient(ellipse 80% 60% at 20% 40%, rgba(40, 30, 80, 0.8) 0%, transparent 60%),
                radial-gradient(ellipse 60% 80% at 80% 60%, rgba(80, 40, 60, 0.6) 0%, transparent 60%),
                radial-gradient(ellipse 100% 100% at 50% 50%, rgba(10, 10, 25, 1) 0%, #05050a 100%);
            animation: drift 40s ease-in-out infinite alternate;
            will-change: transform;
        }

        /* Золотое сияние */
        .aurora::after {
            content: '';
            position: absolute;
            inset: -50%;
            background: 
                radial-gradient(ellipse 50% 40% at 30% 70%, rgba(212, 175, 55, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse 40% 50% at 70% 30%, rgba(180, 140, 60, 0.1) 0%, transparent 50%);
            animation: glow 30s ease-in-out infinite alternate;
            will-change: transform;
            mix-blend-mode: screen;
        }

        /* Средний слой — фиолетово-синий */
        .layer-mid {
            position: absolute;
            inset: -50%;
            background: 
                radial-gradient(ellipse 70% 50% at 60% 50%, rgba(60, 40, 100, 0.5) 0%, transparent 55%),
                radial-gradient(ellipse 50% 70% at 30% 60%, rgba(100, 50, 80, 0.4) 0%, transparent 55%);
            animation: drift2 35s ease-in-out infinite alternate-reverse;
            will-change: transform;
            mix-blend-mode: screen;
        }

        /* Верхний слой — тонкие блики */
        .layer-top {
            position: absolute;
            inset: -50%;
            background: 
                radial-gradient(ellipse 30% 20% at 40% 40%, rgba(255, 220, 150, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse 25% 25% at 70% 70%, rgba(150, 180, 255, 0.06) 0%, transparent 50%);
            animation: shimmer 25s ease-in-out infinite alternate;
            will-change: transform;
            mix-blend-mode: screen;
        }

        /* Едва заметное зерно (не пиксели!) */
        .grain {
            position: absolute;
            inset: 0;
            opacity: 0.035;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)'/%3E%3C/svg%3E");
            background-size: 200px 200px;
            animation: grainMove 8s steps(10) infinite;
        }

        /* Виньетка по краям */
        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.6) 100%);
            pointer-events: none;
        }

        @keyframes drift {
            0%   { transform: translate(0, 0) scale(1) rotate(0deg); }
            50%  { transform: translate(5%, -3%) scale(1.05) rotate(2deg); }
            100% { transform: translate(-3%, 4%) scale(0.98) rotate(-1deg); }
        }

        @keyframes drift2 {
            0%   { transform: translate(0, 0) scale(1); }
            50%  { transform: translate(-4%, 3%) scale(1.08); }
            100% { transform: translate(3%, -5%) scale(0.95); }
        }

        @keyframes glow {
            0%   { transform: translate(0, 0) scale(1); opacity: 0.8; }
            50%  { transform: translate(6%, 4%) scale(1.1); opacity: 1; }
            100% { transform: translate(-4%, -3%) scale(0.95); opacity: 0.9; }
        }

        @keyframes shimmer {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-8%, 6%) scale(1.15); }
        }

        @keyframes grainMove {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-5%, -10%); }
            20% { transform: translate(-15%, 5%); }
            30% { transform: translate(7%, -25%); }
            40% { transform: translate(-5%, 25%); }
            50% { transform: translate(-15%, 10%); }
            60% { transform: translate(15%, 0%); }
            70% { transform: translate(0%, 15%); }
            80% { transform: translate(3%, 35%); }
            90% { transform: translate(-10%, 10%); }
        }

        /* 4K адаптация */
        @media (min-width: 2560px) {
            .grain { background-size: 400px 400px; }
        }
        @media (min-width: 3840px) {
            .grain { background-size: 600px 600px; }
        }
    </style>
</head>
<body>
    <div class="aurora">
        <div class="layer-mid"></div>
        <div class="layer-top"></div>
        <div class="grain"></div>
        <div class="vignette"></div>
    </div>
</body>
</html>
